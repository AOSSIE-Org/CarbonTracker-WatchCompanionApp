# Enables IDE autocompletion for this config file
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Language for CodeRabbit's review comments
language: en

# Enable experimental features (currently not using any specific early_access features)
early_access: true

chat:
  # CodeRabbit will automatically respond to @coderabbitai mentions in PR comments
  auto_reply: true

issue_enrichment:
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: Issues reporting bugs, errors, crashes, incorrect behavior, or unexpected results. This includes runtime errors, logic errors, broken functionality, regressions, and any deviation from expected or documented behavior.
      - label: enhancement
        instructions: Feature requests, improvements to existing functionality, performance optimizations, refactoring suggestions, UI/UX enhancements, and any suggestions to make the project better or add new capabilities.
      - label: documentation
        instructions: Documentation updates, additions, corrections, or clarifications needed. This includes missing docs, outdated information, unclear instructions, API documentation, code examples, README improvements, and any requests for better explanations or guides.
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - "plan-me" # Auto-plan issues with this label
        - "feature" # Also auto-plan these
        - "!no-plan" # Never auto-plan issues with this label

reviews:
  profile: assertive # Options: chill (focuses on significant issues, less nitpicky about style), assertive (more thorough, flags style issues and minor improvements too)

  auto_review:
    # Automatically trigger reviews when PRs are opened or updated
    enabled: true
    # Skip auto-review if PR title contains these keywords
    ignore_title_keywords:
      - "WIP"
    # Don't auto-review draft PRs
    drafts: false
    # Only auto-review PRs targeting these branches
    base_branches:
      - main
      - develop

  # Include a high-level summary at the start of each review
  high_level_summary: true

  # Generate sequence diagrams for complex code flows
  sequence_diagrams: true

  # Include poems in reviews
  poem: false

  # Show review completion status
  review_status: true

  # Keep the walkthrough section expanded by default
  collapse_walkthrough: false

  # Include summary of all changed files
  changed_files_summary: true

  # Automatically request changes on the PR (just leave comments)
  request_changes_workflow: true

  # Pre-merge checks to enforce before merging PRs
  pre_merge_checks:
    description:
      # Validate that PR has a proper description
      mode: warning # Options: off, warning, error
    docstrings:
      # Disable docstring coverage checks (let's assume we don't need them)
      mode: off

  # Exclude these paths from reviews (build artifacts and dependencies)
  path_filters:
    - "!**/node_modules/**" # npm dependencies
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"

  # Use the following tools when reviewing
  tools:
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    yamllint:
      enabled: true
    gitleaks:
      enabled: true

  # Apply the following labels to PRs
  labeling_instructions:
    - label: Kotlin
      instructions: >
        Apply when the PR contains changed to Kotlin Source code.
    - label: Documentation
      instructions: >
        Apply whenever project documentation (namely markdown source-code) is
        updated by the PR/MR
    - label: Linter
      instructions: >
        Apply when the purpose of the PR/MR is related to fixing the feedback
        from a linter

  # Review instructions that apply to all files
  instructions: >-
    Review the code primarily for correctness, reliability, security, maintainability,
    and consistency with the existing CarbonTracker architecture.
    Prioritize real bugs and meaningful issues over stylistic preferences.
    Do not suggest unnecessary rewrites, architectural changes, or refactoring
    unless there is a concrete benefit.
    Avoid comments about personal coding preferences when the existing implementation
    is valid and consistent with the project.

    Check for:
        - Incorrect behavior and regressions
        - Null-safety problems
        - Async/concurrency issues and race conditions
        - Resource leaks and improper cleanup
        - Error handling and failure states
        - Data consistency
        - Security and privacy issues
        - Meaningful performance problems
        - Code duplication
        - Missing tests for important behavior

        Do not require tests for trivial UI changes, simple constants, boilerplate,
        or changes where testing would provide little value.
        Do not request copyright-year changes unless the project explicitly requires
        them.

        Keep comments concise and actionable.
        Do not suggest adding comments when the code is already self-explanatory.

  # Custom review instructions for specific file patterns
  path_instructions:
    # Review documentation files for correctness, clarity, consistency with the actual application, and broken or misleading instructions.

    - path: "**/*.md"
      instructions: >
        Check documentation for correctness, clarity, consistency with the
        actual application, and broken or misleading instructions.


    # Review privacy policy files for accuracy regarding data collection, storage, processing, deletion, export, permissions, and third-party services.

    - path: "PRIVACY.md"
      instructions: >
        Pay particular attention to whether the privacy policy accurately
        describes the application's actual data collection, storage, processing,
        deletion, export, permissions, and third-party services.

        Do not invent privacy practices that are not supported by the code.

    # Review phone <-> watch messaging
    - path: "wear/app/src/main/java/**/services/WearListenerService.kt"
      instructions: >
        Review Wearable Data Layer service code carefully.

        Check:
        - Message path handling and unknown or malformed paths
        - Handling of failed or unacknowledged sends
        - Long-running or blocking work inside onMessageReceived
        - Service lifecycle and coroutine scope cleanup
        - Messages arriving while the app or database is not ready
        - Duplicate or out-of-order messages
        - Sensitive data (location, activity details) written to Logcat
        - Only the minimum necessary data is sent to the phone

    # Review the foreground exercise service
    - path: "wear/app/src/main/java/**/services/ExerciseService.kt"
      instructions: >
        Review foreground service correctness carefully.

        Check:
        - Foreground service started promptly with the correct type and
          notification, and stopped cleanly when the exercise ends
        - Coroutine scope ownership and cancellation
        - Behavior when notification or health permissions are revoked
        - Battery impact of long-running tracking

    # Review Health Services / exercise logic
    - path: "wear/app/src/main/java/**/services/*Exercise*.kt"
      instructions: >
        Review Health Services exercise-tracking code carefully.

        Check:
        - ExerciseClient setup, capability checks, and unsupported exercise
          types or metrics on some devices
        - Correct exercise state transitions (prepare, start, pause, resume, end)
          and handling of invalid transitions
        - Callback registration and removal (no leaked listeners)
        - Handling of missing, delayed, or out-of-order metric updates
        - Incorrect aggregation of distance, calories, and duration
        - Recovery when the exercise ends unexpectedly or the app is killed
        - Metrics persisted to the local database consistently

    - path: "wear/app/src/main/java/**/services/*Health*.kt"
      instructions: >
        Review health-data integration carefully.

        Check:
        - Permission handling (body sensors, activity recognition) and
          denied or revoked states
        - Missing or unavailable health data and unsupported devices
        - Async behavior, error propagation, and resource cleanup
        - Unnecessary repeated health-data queries
        - Health data not logged or exposed beyond what is needed

    # Review shared state and client providers
    - path: "wear/app/src/main/java/**/providers/*State*.kt"
      instructions: >
        Review shared state holder code carefully.

        Check:
        - Thread safety of state updates between the service and UI
        - Correct use of StateFlow/SharedFlow
        - State consistency after process death or service restart
        - No stale or leaked references to Context, services, or UI

    - path: "wear/app/src/main/java/**/providers/*Client*.kt"
      instructions: >
        Review client provider code for correct lifecycle and ownership:
        lazy initialization, no leaked Context, safe reuse across the
        service and UI.

    # Review the watch's local database and sync state
    - path: "wear/app/src/main/java/**/data/database/*.kt"
      instructions: >
        Pay particular attention to Room database correctness on the watch.

        Check:
        - Schema consistency between entity, DAO queries, and database version
        - Migrations or a deliberate fallback strategy when the schema changes
        - Query correctness (filtering, nullability, ordering, limits)
        - Activities left open (endTime IS NULL) after crashes or restarts,
          and more than one open activity at a time
        - isSynced handling: records marked synced only after the phone
          confirms receipt, and never deleted before that
        - Concurrent database access and thread safety of the singleton
        - Duplicate records and data consistency with the phone app
        - Error handling for failed database operations
        - Database access kept off the main thread

        Do not suggest changing the database architecture without a concrete
        technical reason.
